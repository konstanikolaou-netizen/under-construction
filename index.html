<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Under Construction</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(1200px 600px at 20% 10%, #1e3a5f 0%, #0b1220 55%, #070b14 100%);
      color: #e8eef7;
      padding: 2rem;
    }
    main {
      max-width: 36rem;
      text-align: center;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 1.25rem;
      padding: 2.5rem 2rem;
      backdrop-filter: blur(8px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #9ec5ff;
      border: 1px solid rgba(158,197,255,0.35);
      border-radius: 999px;
      padding: 0.35rem 0.75rem;
      margin-bottom: 1.25rem;
    }
    h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(1.6rem, 4vw, 2.1rem);
      font-weight: 650;
      line-height: 1.2;
    }
    p {
      margin: 0;
      color: #b7c4d8;
      line-height: 1.55;
      font-size: 1.05rem;
    }
  </style>
</head>
<body>
  <main>
    <div class="badge">Coming soon</div>
    <h1>This site is under construction</h1>
    <p>Thanks for stopping by. We&rsquo;re building something here and will be back soon.</p>
  </main>
</body>
</html>
